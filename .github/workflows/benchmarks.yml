name: Benchmarks

# Runs on every release tag push, alongside the Release workflow. Releases are
# created by release.yml with the default GITHUB_TOKEN, and GitHub does not start
# workflows for events created by GITHUB_TOKEN, so `on: release` stopped firing
# after v1.2.2. Release tags (v*) are protected, so a tag push is a trusted
# trigger for a job that builds and runs the code.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: read-all

jobs:
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked -p nora-registry

      - name: Record binary size
        id: binary
        run: |
          SIZE=$(stat -c%s target/release/nora)
          SIZE_MB=$(echo "scale=1; $SIZE / 1048576" | bc)
          echo "size_bytes=$SIZE" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"
          echo "Binary size: ${SIZE_MB} MB"

      - name: Start NORA
        id: start
        run: |
          mkdir -p /tmp/nora-bench-data
          # A public URL is required when binding the wildcard address (config/mod.rs).
          # The .invalid host is deliberate: nothing in the benchmark resolves it.
          NORA_HOST=0.0.0.0 \
          NORA_PORT=4000 \
          NORA_PUBLIC_URL=http://nora-benchmark.invalid:4000 \
          NORA_STORAGE_PATH=/tmp/nora-bench-data \
          NORA_RATE_LIMIT_ENABLED=false \
          NORA_AUTH_ENABLED=false \
            target/release/nora serve &
          NORA_PID=$!
          echo "NORA_PID=$NORA_PID" >> "$GITHUB_ENV"

          # Measure cold start: wall-clock from exec to first successful /health.
          START=$(date +%s%N)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null 2>&1; then
              END=$(date +%s%N)
              STARTUP_MS=$(( (END - START) / 1000000 ))
              echo "startup_ms=$STARTUP_MS" >> "$GITHUB_OUTPUT"
              echo "Startup time: ${STARTUP_MS}ms"
              break
            fi
            sleep 0.1
          done

      - name: Record idle memory
        id: memory
        run: |
          sleep 2
          VMRSS=$(grep VmRSS /proc/$NORA_PID/status | awk '{print $2}')
          echo "idle_kb=$VMRSS" >> "$GITHUB_OUTPUT"
          echo "Idle VmRSS: ${VMRSS} kB"

      - name: Run criterion benchmarks
        # Only the criterion target: with `-p` alone cargo also runs the library's unit-test
        # harness, which rejects `--output-format` and used to leave the results empty (#1309).
        run: |
          set -o pipefail
          cargo bench --locked -p nora-registry --bench parsing -- --output-format bencher | tee /tmp/criterion-results.txt
          if ! grep -q 'bench:' /tmp/criterion-results.txt; then
            echo "::error::criterion produced no results"
            exit 1
          fi

      - name: Generate summary report
        id: report
        env:
          RUN_TAG: ${{ github.ref_name }}
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          VERSION="${RUN_TAG:-dev}"

          cat > /tmp/nora-bench-report.json << EOF
          {
            "version": "$VERSION",
            "timestamp": "$TIMESTAMP",
            "binary_size_bytes": ${{ steps.binary.outputs.size_bytes }},
            "startup_ms": ${{ steps.start.outputs.startup_ms || '0' }},
            "memory_idle_kb": ${{ steps.memory.outputs.idle_kb || '0' }}
          }
          EOF
          cat /tmp/nora-bench-report.json

      - name: Stop NORA
        if: always()
        run: kill $NORA_PID 2>/dev/null || true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-results-${{ github.sha }}
          path: |
            /tmp/nora-bench-report.json
            /tmp/criterion-results.txt
          retention-days: 90

  # Separate job so that only this step holds a write token; the build above
  # runs with read-only permissions. It waits for the Release workflow to create
  # the release, since this run starts in parallel with it.
  publish:
    name: Attach results to release
    needs: benchmarks
    if: github.event_name == 'push' && needs.benchmarks.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read   # download the artifact of this run
      contents: write # gh release upload

    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bench-results-${{ github.sha }}
          path: bench-out

      - name: Upload report to release (waits for the release to exist)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout, so gh needs the repository named (#1309).
          GH_REPO: ${{ github.repository }}
          RUN_TAG: ${{ github.ref_name }}
        run: |
          for i in $(seq 1 120); do
            if err=$(gh release view "$RUN_TAG" 2>&1 > /dev/null); then
              gh release upload "$RUN_TAG" bench-out/nora-bench-report.json --clobber
              exit 0
            fi
            # Only a missing release is worth waiting for; any other error is final.
            case "$err" in
              *"release not found"*) ;;
              *) echo "::error::gh release view $RUN_TAG failed: $err"; exit 1 ;;
            esac
            echo "release $RUN_TAG not published yet (attempt $i/120), retrying in 30s"
            sleep 30
          done
          echo "::error::release $RUN_TAG was not published within 60 minutes"
          exit 1
