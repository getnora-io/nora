# Put the package on a clean system before a release, not after one.
#
# release.yml builds the .deb and .rpm at tag time and uploads them; nothing ever
# installed one. A change under dist/ therefore passed every check we had and was
# validated by the first user to run `apt install` (#1031). Two defects shipped that
# way: the unit file under /lib/systemd/system, forbidden since the /usr merge (four
# lintian errors, in every release until #1023), and an upgrade that stopped the
# registry and never started it again (#1035).
#
# Path-filtered on purpose: it builds a release binary, which is too slow to run on
# every pull request, and only dist/ and the check itself can change the answer.
name: Packaging

on:
  pull_request:
    paths:
      - dist/**
      - Dockerfile
      - scripts/package-install-check.sh
      - .github/workflows/packaging.yml
  push:
    branches: [main]
    paths:
      - dist/**
      - Dockerfile
      - scripts/package-install-check.sh
      - .github/workflows/packaging.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install (${{ matrix.format }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      # The binary has to be the one the release ships, not merely a release build.
      # release.yml takes it from this Dockerfile's `binary` stage, compiled in
      # rust:1-alpine: a static musl executable with no DT_NEEDED entries. A plain
      # `cargo build --release` on this runner produces a glibc-dynamic binary
      # instead, and lintian describes the two differently — the shipped one reports
      # `shared-library-lacks-prerequisites`, the runner's one reports
      # `missing-dependency-on-libc` and `hardening-no-fortify-functions`. The
      # baseline in dist/lintian-expected.txt then described a package nobody
      # installs, and three tags sat in it wrongly, in both directions, until the
      # released 1.3.3 deb was scanned by hand.
      #
      # The build is cached: cold it compiles the whole workspace, warm it is a
      # cache hit. That is affordable because this workflow is path-filtered.
      - name: Build the binary the way the release does
        run: |
          docker buildx build --platform linux/amd64 --target binary \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --output type=local,dest=./dist-amd64 .
          cp ./dist-amd64/nora ./nora
          chmod +x ./nora
          file ./nora

      - name: Install nfpm
        run: |
          set -o pipefail
          NFPM_VERSION=2.46.3
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fSL --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 15 --max-time 120 \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/bin" nfpm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/nfpm" --version

      - name: Build the ${{ matrix.format }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "packaging version $VERSION"
          VERSION="$VERSION" NFPM_ARCH=amd64 nfpm package \
            --config dist/nora.nfpm.yaml \
            --packager ${{ matrix.format }} \
            --target ./nora-built.${{ matrix.format }}

      # The last released package enables the migration pass. It is optional: a run
      # without it still checks the install, the self-upgrade and lintian, so a
      # release-download hiccup degrades the job rather than failing it.
      - name: Fetch the last released package
        id: released
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p released
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern "nora-amd64.${{ matrix.format }}" --dir released --clobber
          ls -l released

      - name: Install, upgrade and scan
        run: |
          OLD=released/nora-amd64.${{ matrix.format }}
          [ -f "$OLD" ] || OLD=""
          bash scripts/package-install-check.sh ${{ matrix.format }} ./nora-built.${{ matrix.format }} $OLD
